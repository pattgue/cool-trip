# Al subir una etiqueta x.y.z (sin «v»): comprueba que coincide con manifest.json, pasa las comprobaciones, compila
# y crea una Release con main.js, manifest.json y styles.css (lo que descarga Obsidian, o BRAT).
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write       # las atestaciones (prueban que main.js y styles.css salen de este repo)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version from manifest.json
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag matches manifest.json
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::The tag (${GITHUB_REF_NAME}) does not match the version in manifest.json (${{ steps.v.outputs.version }})."
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Attest main.js and styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
          else
            gh release create "$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --generate-notes main.js manifest.json styles.css
          fi
